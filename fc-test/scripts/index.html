<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Future Compute Skill Test</title>
</head>

<body>

<script>
window.ai_edge_gallery_get_result = async function(data) {
    try {
        const jsonData = JSON.parse(data);

        return JSON.stringify({
            result: {
                status: "SUCCESS",
                skill: "fc-test",
                received: jsonData.message || null,
                message: "Future Compute JavaScript skill is working."
            }
        });

    } catch (e) {
        console.error("fc-test error:", e);

        return JSON.stringify({
            error: "fc-test failed: " + e.message
        });
    }
};
</script>

</body>
</html>
