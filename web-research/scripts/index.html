<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Research</title>
</head>

<body>

<script>

window['ai_edge_gallery_get_result'] = async (data) => {

    try {

        const params = JSON.parse(data);

        const query = params.query;

        if (!query) {
            throw new Error("Missing search query");
        }

        const testResponse = await fetch(
            "https://www.google.com/robots.txt"
        );

        if (!testResponse.ok) {
            throw new Error(
                `Network test failed with HTTP ${testResponse.status}`
            );
        }

        const testText = await testResponse.text();

        return JSON.stringify({

            result: {
                network_test: "SUCCESS",
                http_status: testResponse.status,
                response_preview: testText.slice(0, 200)
            }

        });

    } catch (error) {

        const errorMessage =
            error && error.message
                ? error.message
                : String(error);

        const errorName =
            error && error.name
                ? error.name
                : "UnknownError";

        const errorStack =
            error && error.stack
                ? error.stack
                : "";

        console.error(
            "WEB_RESEARCH_ERROR: " +
            errorName +
            " | " +
            errorMessage
        );

        return JSON.stringify({

            error: {
                name: errorName,
                message: errorMessage,
                stack: errorStack
            }

        });

    }

};

</script>

</body>
</html>
